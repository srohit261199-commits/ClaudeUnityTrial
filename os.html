<template id="tpl-about"><section class="os-win" role="dialog" aria-label="About.txt"><header class="os-bar"><span>About.txt</span><button type="button" class="os-x" aria-label="Close About.txt">✕</button></header><div class="os-body" data-lenis-prevent><h2>Rohit <i></i> Sharma</h2>
      <p>I'm a 3D visualizer with six years in furniture, interiors and e-commerce. I put 800+ product and room-set images on Skeidar's live site, and before that rebuilt 400+ products from raw scan data at Amazon.</p>
      <p>I've measured client homes and stood on factory floors to check the furniture matched the design. That loop is why my renders hold up.</p>
      <p>Find me on <a href="https://www.linkedin.com/in/rohit872" target="_blank" rel="noopener">LinkedIn</a>, or <button type="button" class="os-link" data-line>pick up the studio line</button>.</p></div></section></template><template id="tpl-resume"><section class="os-win" role="dialog" aria-label="Resume.pdf"><header class="os-bar"><span>Resume.pdf</span><button type="button" class="os-x" aria-label="Close Resume.pdf">✕</button></header><div class="os-body" data-lenis-prevent><figure class="os-resume"><img src="assets/resume.jpg" alt="Rohit Sharma's resume" loading="lazy"></figure>
